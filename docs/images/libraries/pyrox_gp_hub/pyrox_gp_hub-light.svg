<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="488" viewBox="0 0 1240 488" role="img" aria-label="One GP prior is scored as a NumPyro factor, gives its log marginal, conditions and predicts at any inputs, gives the gradient posterior and pathwise draws, conditions on a non-Gaussian likelihood, and scores its Laplace evidence as a factor.">
