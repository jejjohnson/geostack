<rect x="40" y="378" width="26" height="16" rx="4" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/><text x="74" y="391" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B7280">looks pyrox-nn up lazily (the names it serves below), and does not depend on it</text>
</svg>
