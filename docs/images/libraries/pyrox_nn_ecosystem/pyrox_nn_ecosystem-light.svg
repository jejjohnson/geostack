<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-label="No package imports pyrox-nn. The pyrox core&#x27;s pyrox.inference looks it up lazily to serve LastLayerLaplace and last_layer_laplace with a deprecation warning, drawn dashed, inside the pyrox workspace in GeoML. pyrox-nn builds on pyrox, geonnax, functax, kernellib, argminax, gaussx, lineax, JAX, Equinox, NumPyro and einx, and on optax, pandas and xarray through extras.">
<title>pyrox-nn in the GeoML layer</title>
