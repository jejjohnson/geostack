<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937">pyrox-nn</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">uncertainty-aware layers and neural fields</text>
<rect x="20" y="140" width="920" height="140" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">GeoML</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B7280">the pyrox workspace; no other package imports pyrox-nn</text><path d="M480 140 L480 95" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ea-light)"/>
<rect x="320.0" y="188" width="320" height="74" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 5"/><text x="480.0" y="211" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#1F2937">pyrox.inference</text><text x="480.0" y="230" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">a deprecated lazy lookup</text><text x="480.0" y="249" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#334155">LastLayerLaplace · last_layer_laplace</text>
