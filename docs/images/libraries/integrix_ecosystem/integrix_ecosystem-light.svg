<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Packages that import integrix: finitevolX in GeoNumerics, which uses its steppers; vardax in GeoML, which uses its checkpointed scan; and plumax, which uses its rules, expectations and a stepper, and sesmax-core, which uses its IMEX control, in GeoModels. plumax and sesmax-core build on finitevolX, and on vardax through an extra. integrix builds on functax, diffrax, lineax, optimistix, JAX, Equinox, einx and jaxtyping.">
