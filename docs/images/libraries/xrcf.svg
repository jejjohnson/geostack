<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="xrcf is the floor of the xarray side, under both the readers and the operators" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect x="0" y="0" width="760" height="400" rx="10" fill="#ffffff"/><defs><marker id="xcf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">xrcf is the floor of the xarray side, under both the readers and the operators</text><g><rect x="24" y="52" width="340" height="68" rx="8" fill="none" stroke="#8b949e" stroke-width="1.25"></rect><text x="194" y="78" text-anchor="middle" font-weight="600" fill="#1f2328">xrproducts</text><text x="194" y="100" text-anchor="middle" font-size="11.5" fill="#57606a">reads archives; names what it reads</text></g><g><rect x="396" y="52" width="340" height="68" rx="8" fill="none" stroke="#8b949e" stroke-width="1.25"></rect><text x="566" y="78" text-anchor="middle" font-weight="600" fill="#1f2328">xrops</text><text x="566" y="100" text-anchor="middle" font-size="11.5" fill="#57606a">computes; names what it outputs</text></g><g fill="none" stroke="#8b949e" stroke-width="1.25"><path d="M194 120V170" marker-end="url(#xcf-arrow)"></path><path d="M566 120V170" marker-end="url(#xcf-arrow)"></path><path d="M380 252V318" marker-end="url(#xcf-arrow)"></path></g><text x="206" y="150" font-size="11.5" fill="#57606a">imports</text><text x="554" y="150" text-anchor="end" font-size="11.5" fill="#57606a">imports, instead of xrproducts</text><g><rect x="120" y="172" width="520" height="80" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="380" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">xrcf · GeoStack, xrtoolz tier 0</text><text x="380" y="220" text-anchor="middle" fill="#1f2328">variables · conventions · crs · validation · vocabulary · subset</text><text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#57606a">takes xrproducts.types, xrops.cf and the CRS half of xrops.geom</text></g><text x="392" y="290" font-size="11.5" fill="#57606a">built on; no import from GeoNumerics or Core</text><g><rect x="120" y="320" width="520" height="48" rx="8" fill="#eef2f7" stroke="#8b949e" stroke-width="1.25"></rect><text x="380" y="349" text-anchor="middle" fill="#1f2328">xarray · pandas · NumPy · pyproj</text></g></svg>
