<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="functax&#x27;s modules and their imports: project imports interp; interp imports transform, basis, quad and geometry; transform and basis import quad and geometry; diffops imports geometry; geometry and quad import each other. scipy comes through an extra when a scattered plan is built.">
