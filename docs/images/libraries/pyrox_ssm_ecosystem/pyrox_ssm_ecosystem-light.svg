<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" role="img" aria-label="No package imports pyrox-ssm. In the pyrox workspace in GeoML, pyrox-gauss and pyrox-xtreme forbid importing it in their import-guard tests. pyrox-ssm builds on pyrox, pyrox-gauss, gaussx, lineax, optimistix, JAX, Equinox, NumPyro and einx, and on flowjax, gauss-flows and filterax through extras.">
<title>pyrox-ssm in the GeoML layer</title>
<rect x="250" y="18" width="460" height="74" rx="14" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
<svg x="266" y="31" width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="prxssm-light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#E11D48"/></linearGradient></defs><g transform="translate(0 0) scale(1)"><rect x="4" y="4" width="120" height="120" rx="26" fill="url(#prxssm-light)"/><circle cx="26" cy="44" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="64" cy="44" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><circle cx="102" cy="44" r="9.5" fill="none" stroke="#FFFFFF" stroke-width="4.5"/><path d="M39 44 L52 44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M46 38.5 L52 44 L46 49.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M77 44 L90 44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M84 38.5 L90 44 L84 49.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 56 L26 76" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/><path d="M64 56 L64 76" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/><path d="M102 56 L102 76" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/><circle cx="26" cy="88" r="8.5" fill="#FFFFFF"/><circle cx="102" cy="88" r="8.5" fill="#FFFFFF"/><circle cx="64" cy="88" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4"/></g></svg>
<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937">pyrox-ssm</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">state-space models for NumPyro</text>
<rect x="20" y="140" width="920" height="126" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F2937">GeoML</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B7280">the pyrox workspace; no package imports pyrox-ssm</text><text x="480" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B7280">these siblings forbid importing pyrox-ssm, each in an import-guard test</text>
<rect x="360.2" y="220" width="109.9" height="26" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 4"/><text x="415.1" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#334155">pyrox-gauss</text>
<rect x="482.1" y="220" width="117.7" height="26" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 4"/><text x="541.0" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#334155">pyrox-xtreme</text>
<rect x="20" y="288" width="920" height="62" rx="10" fill="#F3F4F6" stroke="#D1D5DB"/>
<text x="480" y="313.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6B7280">pyrox-ssm builds on: <tspan font-weight="700" fill="#1F2937">pyrox</tspan> · <tspan font-weight="700" fill="#1F2937">pyrox-gauss</tspan> · <tspan font-weight="700" fill="#1F2937">gaussx</tspan> · <tspan font-weight="700" fill="#1F2937">lineax</tspan> · <tspan font-weight="700" fill="#1F2937">optimistix</tspan></text>
<text x="480" y="335.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6B7280"><tspan font-weight="700" fill="#1F2937">JAX</tspan> · <tspan font-weight="700" fill="#1F2937">Equinox</tspan> · <tspan font-weight="700" fill="#1F2937">NumPyro</tspan> · <tspan font-weight="700" fill="#1F2937">einx</tspan> · <tspan font-weight="700" fill="#1F2937">flowjax, gauss-flows, filterax (extras)</tspan></text>
<text x="40" y="377" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B7280">no arrow: nothing imports pyrox-ssm. pyrox-gp names it only in the ImportError its old Markov-GP names raise, and does not import it.</text>
</svg>
