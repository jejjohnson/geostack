<rect x="20" y="288" width="920" height="62" rx="10" fill="#1F2937" stroke="#374151"/>
<text x="480" y="313.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CA3AF">pyrox-lgm builds on: <tspan font-weight="700" fill="#E5E7EB">pyrox</tspan> · <tspan font-weight="700" fill="#E5E7EB">pyrox-gauss</tspan> · <tspan font-weight="700" fill="#E5E7EB">gaussx</tspan> · <tspan font-weight="700" fill="#E5E7EB">lineax</tspan> · <tspan font-weight="700" fill="#E5E7EB">kernellib</tspan> · <tspan font-weight="700" fill="#E5E7EB">functax</tspan> · <tspan font-weight="700" fill="#E5E7EB">argminax</tspan> · <tspan font-weight="700" fill="#E5E7EB">optimistix</tspan> · <tspan font-weight="700" fill="#E5E7EB">matfree</tspan></text>
<text x="480" y="335.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CA3AF"><tspan font-weight="700" fill="#E5E7EB">JAX</tspan> · <tspan font-weight="700" fill="#E5E7EB">Equinox</tspan> · <tspan font-weight="700" fill="#E5E7EB">NumPyro</tspan> · <tspan font-weight="700" fill="#E5E7EB">einx</tspan> · <tspan font-weight="700" fill="#E5E7EB">xarray (extra)</tspan></text>
<text x="40" y="377" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">no arrow: nothing imports pyrox-lgm, and pyrox-lgm never imports pyrox-gp, its covariance-form sibling.</text>
</svg>
