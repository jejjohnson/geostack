<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" role="img" aria-label="No package imports pyrox-lgm. In the pyrox workspace in GeoML, pyrox-gauss, pyrox-ssm and pyrox-xtreme forbid importing it in their import-guard tests. pyrox-lgm builds on pyrox, pyrox-gauss, gaussx, lineax, kernellib, functax, argminax, optimistix, matfree, JAX, Equinox, NumPyro and einx, and on xarray through an extra.">
<title>pyrox-lgm in the GeoML layer</title>
<rect x="250" y="18" width="460" height="74" rx="14" fill="#111827" stroke="#94A3B8" stroke-width="2"/>
<svg x="266" y="31" width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="prxlgm-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#E11D48"/></linearGradient></defs><g transform="translate(0 0) scale(1)"><rect x="4" y="4" width="120" height="120" rx="26" fill="url(#prxlgm-dark)"/><path d="M36 36 L92 36 M36 64 L92 64 M36 92 L92 92 M36 36 L36 92 M64 36 L64 92 M92 36 L92 92" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3.5" stroke-linecap="round"/><circle cx="36" cy="36" r="7" fill="#FFFFFF"/><circle cx="64" cy="36" r="7" fill="#FFFFFF"/><circle cx="92" cy="36" r="7" fill="#FFFFFF"/><circle cx="36" cy="64" r="7" fill="#FFFFFF"/><circle cx="92" cy="64" r="7" fill="#FFFFFF"/><circle cx="36" cy="92" r="7" fill="#FFFFFF"/><circle cx="64" cy="92" r="7" fill="#FFFFFF"/><circle cx="92" cy="92" r="7" fill="#FFFFFF"/><circle cx="64" cy="64" r="13" fill="none" stroke="#FFFFFF" stroke-width="3"/><circle cx="64" cy="64" r="7" fill="#FFFFFF"/></g></svg>
<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E5E7EB">pyrox-lgm</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">latent Gaussian models for NumPyro</text>
<rect x="20" y="140" width="920" height="126" rx="14" fill="#0F172A" stroke="#1F2937" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">GeoML</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">the pyrox workspace; no package imports pyrox-lgm</text><text x="480" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">these siblings forbid importing pyrox-lgm, each in an import-guard test</text>
<rect x="307.0" y="220" width="109.9" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="362.0" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-gauss</text>
<rect x="429.0" y="220" width="94.3" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="476.1" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-ssm</text>
