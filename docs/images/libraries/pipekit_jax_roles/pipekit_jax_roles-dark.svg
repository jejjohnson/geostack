<svg xmlns="http://www.w3.org/2000/svg" width="960" height="792" viewBox="0 0 960 792" role="img" aria-label="pipekit-jax on the GeoStack role ladder: ScanCycle, EnsembleScanCycle and Rollout as recipes; JaxOperator, JaxModelOp, JaxKernelOp and to_jax as steps, with the weight methods serialize_weights, with_weights and from_registry; no algorithms, models, strategies, primitives or structures of its own, which pipekit-cycle, JAX and Equinox fill. Importing the package registers Sequential, Graph and JaxModelOp as pytrees, and check_jax_operator sits beside the steps. Built on pipekit-ops, pipekit-cycle, JAX and Equinox, with pipekit-array through the array extra.">
