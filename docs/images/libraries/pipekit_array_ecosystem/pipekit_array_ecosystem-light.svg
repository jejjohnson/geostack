<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1046" viewBox="0 0 960 1046" role="img" aria-label="The packages that import pipekit-array on their main branches: pipekit-jax, geotoolz-array, geotoolz-ops, geotoolz-patcher, xrtoolz-ops, gridax, geophysix, radiomax, diagnostix, tracerax, plumax; pipekit-jax through its array extra. pipekit-array builds on pipekit-ops and the Array API, with NumPy, JAX, dask, array-api-compat, xarray, einx and scikit-learn as extras.">
