<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-label="The packages that import pipekit-experiment on their main branches: pipekit-train, through its experiment extra, for its artifacts module. pipekit-jax and the pipekit umbrella import nothing from it, and no package outside the pipekit workspace imports it. pipekit-experiment builds on pipekit-ops, with fsspec and s3fs, DVC, Hydra and hydra-zen, and Metaflow as extras.">
<title>pipekit-experiment and the packages that import it</title>
<defs><marker id="ea-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker></defs>
<rect x="250" y="18" width="460" height="74" rx="14" fill="#111827" stroke="#94A3B8" stroke-width="2"/>
<svg x="266" y="31" width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="pke-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64748B"/><stop offset="1" stop-color="#334155"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="26" fill="url(#pke-dark)"/><path d="M34 100 L34 28" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><path d="M34 76 C34 64 66 70 66 56" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><path d="M34 52 C34 42 66 38 66 30" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" stroke-opacity="0.45"/><path d="M66 56 C66 46 98 86 98 72" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/><circle cx="34" cy="100" r="8" fill="#FFFFFF" fill-opacity="0.92"/><circle cx="34" cy="76" r="7" fill="#FFFFFF" fill-opacity="0.92"/><circle cx="34" cy="52" r="7" fill="#FFFFFF" fill-opacity="0.92"/><circle cx="34" cy="28" r="7" fill="#FFFFFF" fill-opacity="0.28"/><circle cx="66" cy="56" r="7" fill="#FFFFFF" fill-opacity="0.92"/><circle cx="66" cy="30" r="7" fill="#FFFFFF" fill-opacity="0.28"/><circle cx="98" cy="72" r="11" fill="#FFFFFF" fill-opacity="0.92"/></svg>
<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E5E7EB">pipekit-experiment</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">a content-addressed model registry and run records</text>
<text x="694" y="52" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">Core · tier 0</text>
<path d="M480 140 L480 95" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ea-dark)"/>
<text x="492" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">imported through an optional extra</text>
<rect x="20" y="140" width="920" height="154" rx="14" fill="#0F172A" stroke="#1F2937" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">pipekit</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">the rest of the workspace</text>
<rect x="38.0" y="184" width="209.0" height="92" rx="10" fill="#111827" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="142.5" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="700" fill="#E5E7EB">pipekit-train</text><text x="142.5" y="224" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">training loops</text><text x="142.5" y="241" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9CA3AF">through its experiment extra</text><text x="142.5" y="261" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#CBD5E1">artifacts</text>
<text x="271.0" y="207.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">pipekit-jax imports nothing from it: JaxModelOp.from_registry reads weights from any</text>
<text x="271.0" y="225.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">ModelRegistry by shape. pipekit-train&#x27;s Checkpoint and LogToExperiment take any</text>
<text x="271.0" y="243.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">ModelRegistry or ExperimentTracker the same way, and the pipekit umbrella installs it</text>
<text x="271.0" y="261.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">without importing it.</text>
<rect x="20" y="310" width="920" height="82" rx="14" fill="#0F172A" stroke="#1F2937" stroke-width="1.5"/><text x="38" y="336" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">outside</text><text x="922" y="336" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">GeoStack, GeoNumerics, GeoML, GeoModels</text><text x="480" y="368" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#9CA3AF">no package outside the pipekit workspace imports pipekit-experiment on main</text>
<rect x="20" y="414" width="920" height="62" rx="10" fill="#1F2937" stroke="#374151"/><text x="480" y="440" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CA3AF">pipekit-experiment builds on <tspan font-weight="700" fill="#E5E7EB">pipekit-ops</tspan></text><text x="480" y="462" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">and, through its extras, fsspec and s3fs, DVC, Hydra and hydra-zen, and Metaflow</text>
<rect x="40" y="494" width="26" height="16" rx="4" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="74" y="507" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">imports pipekit-experiment through an optional extra (the module it imports)</text>
</svg>
