<svg xmlns="http://www.w3.org/2000/svg" width="960" height="412" viewBox="0 0 960 412" role="img" aria-label="No package imports pyrox-xtreme yet. plumax&#x27;s population extra still imports xtremax.point_processes lazily from the archived xtremax repository that pyrox-xtreme replaces, drawn dashed, in GeoModels. pyrox-xtreme builds on JAX, NumPyro, Equinox, xarray, NumPy, SciPy, pandas, einops and jaxtyping, and on scikit-learn through its threshold extra; it imports no GeoStack library.">
