<svg xmlns="http://www.w3.org/2000/svg" width="960" height="632" viewBox="0 0 960 632" role="img" aria-label="The packages that import pipekit-train on their main branches: geotoolz-patcher, plumax; geotoolz-patcher through its train extra and plumax through its emulate extra. pipekit-train builds on pipekit-ops, with Equinox, optax, Grain, Orbax, NumPyro, BlackJAX, Keras, pipekit-cycle, pipekit-experiment, zarr and fsspec as extras.">
<title>pipekit-train and the packages that import it</title>
