<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="Packages that import pyrox&#x27;s core: pyrox-gp (_core and likelihoods), pyrox-nn (_core and inference), pyrox-lgm and pyrox-ssm (likelihoods), all in the pyrox workspace in GeoML. pyrox builds on JAX, Equinox, NumPyro and einx, and optax through an extra.">
<title>pyrox in the GeoML layer</title>
