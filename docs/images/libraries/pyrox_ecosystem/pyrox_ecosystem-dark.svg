<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E5E7EB">pyrox</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">the Equinox-to-NumPyro bridge and ensemble inference</text>
<rect x="20" y="140" width="920" height="140" rx="14" fill="#0F172A" stroke="#1F2937" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">GeoML</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">the pyrox workspace; its other packages do not import the core</text><path d="M480 140 L480 95" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ea-dark)"/>
