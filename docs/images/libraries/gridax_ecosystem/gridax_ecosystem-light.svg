<svg xmlns="http://www.w3.org/2000/svg" width="960" height="446" viewBox="0 0 960 446" role="img" aria-label="Packages that import gridax: gridax-jax in GeoNumerics, in the same repository, which re-exports all of it; and sesmax-core in GeoModels, which imports the grids, masks, Interpolation2D and the raw stencils. plumax in GeoModels still imports the deprecated finitevolx shim, drawn dashed, and both models reach gridax-jax&#x27;s names through it. gridax builds on NumPy, SciPy, jaxtyping and geophysix, and on JAX when it is installed.">
