<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="488" viewBox="0 0 1240 488" role="img" aria-label="One LGM prior is scored as a NumPyro factor, gives its log marginal, conditions and predicts at new rows, conditions on a non-Gaussian likelihood by Laplace, scores its Laplace evidence as a factor, and is fitted with its hyperparameters integrated out by inla, whose result predicts the mean and variance.">
<title>One prior, seven uses</title>
<defs><marker id="lgm-hub-light-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/></marker></defs>
