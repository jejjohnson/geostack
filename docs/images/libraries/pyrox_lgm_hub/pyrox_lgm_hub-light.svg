<text x="38" y="208" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1F2937" xml:space="preserve">prior: LGMPrior</text>
<text x="38" y="242" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#1F2937" xml:space="preserve">trend = RW2(104, name=&quot;week&quot;)</text>
<text x="38" y="264" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#1F2937" xml:space="preserve">prior = LGMPrior((trend,), FixedEffects((&quot;z&quot;,)))</text>
