<rect x="550" y="20.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="51.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">lgm_factor(&quot;y&quot;, prior, θ, data, σ²)</text>
<text x="1202" y="51.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">a NumPyro factor, for NUTS · SVI</text>
<rect x="550" y="86.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="117.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">prior.log_marginal(θ, data, σ²)</text>
<text x="1202" y="117.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">the collapsed evidence, under jit · grad</text>
<rect x="550" y="152.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="183.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">prior.condition(θ, data, σ²).predict(new)</text>
<text x="1202" y="183.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">mean and variance, include_noise for a band</text>
<rect x="550" y="218.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="249.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">prior.condition_nongauss(θ, lik, data)</text>
<text x="1202" y="249.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">Laplace: predict · joint draws by sample</text>
<rect x="550" y="284.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="315.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">lgm_laplace_factor(&quot;y&quot;, prior, θ, lik, data)</text>
<text x="1202" y="315.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">the Laplace evidence, for NUTS</text>
<rect x="550" y="350.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="381.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">result = inla(LGM(prior, likelihood=lik), data)</text>
<text x="1202" y="381.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">θ integrated out, no sampling</text>
<rect x="550" y="416.0" width="670" height="52" rx="12" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1"/>
<text x="568" y="447.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" fill="#1F2937" xml:space="preserve">result.predict_moments(new)</text>
<text x="1202" y="447.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B7280" xml:space="preserve">mean and variance over the design of θ</text>
