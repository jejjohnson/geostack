<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-label="radtrax, plumax and the GeoStack readers take their geometry and radiometry from radiomax" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect x="0" y="0" width="760" height="476" rx="10" fill="#ffffff"/><defs><marker id="rmx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">Whatever locates or converts what a sensor saw comes from radiomax</text><g><rect x="24" y="52" width="712" height="88" rx="8" fill="none" stroke="#8b949e" stroke-width="1.25"></rect><text x="40" y="76" font-weight="600" fill="#1f2328">Imported by</text><text x="40" y="102" fill="#1f2328">GeoModels: radtrax, plumax</text><text x="40" y="122" fill="#1f2328">GeoStack: geoops, geoproducts</text></g><g fill="none" stroke="#8b949e" stroke-width="1.25"><path d="M380 140V184" marker-end="url(#rmx-arrow)"></path><path d="M380 266V312" marker-end="url(#rmx-arrow)"></path><path d="M380 394V418" marker-end="url(#rmx-arrow)"></path></g><text x="392" y="167" font-size="11.5" fill="#57606a">import</text><text x="392" y="294" font-size="11.5" fill="#57606a">imports</text><g><rect x="120" y="186" width="520" height="80" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="380" y="210" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">radiomax · GeoNumerics tier 1</text><text x="380" y="234" text-anchor="middle" fill="#1f2328">geometry · radiometry · thermal · retrievals · sar · altimetry</text><text x="380" y="254" text-anchor="middle" font-size="11.5" fill="#57606a">takes geoops&#x27; radiometry, the Planck copies and the air-mass factors</text></g><g><rect x="120" y="314" width="520" height="80" rx="8" fill="none" stroke="#8b949e" stroke-width="1.25"></