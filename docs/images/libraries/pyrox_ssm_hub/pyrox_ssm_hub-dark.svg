<text x="1142" y="51.0" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9CA3AF" xml:space="preserve">a NumPyro factor, for NUTS · SVI</text>
