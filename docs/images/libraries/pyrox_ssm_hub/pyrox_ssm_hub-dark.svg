<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="356" viewBox="0 0 1180 356" role="img" aria-label="One Markov GP prior is scored as a NumPyro factor, gives its log marginal by one Kalman pass, conditions and predicts at any times, conditions on a non-Gaussian likelihood, and exposes its Kalman moments and its general state-space form.">
<title>One prior, five uses</title>
<defs><marker id="ssm-hub-dark-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker></defs>
<rect x="20" y="108" width="400" height="140" rx="12" fill="#151838" stroke="#818CF8" stroke-width="2"/>
<text x="38" y="142" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#E5E7EB" xml:space="preserve">prior: MarkovGPPrior</text>
<text x="38" y="176" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#E5E7EB" xml:space="preserve">sde = MaternSDE(variance, lengthscale, order=1)</text>
<text x="38" y="198" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#E5E7EB" xml:space="preserve">prior = MarkovGPPrior(sde, times, mean_fn=mu)</text>
