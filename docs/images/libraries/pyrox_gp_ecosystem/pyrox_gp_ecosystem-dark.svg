<svg xmlns="http://www.w3.org/2000/svg" width="960" height="398" viewBox="0 0 960 398" role="img" aria-label="No package imports pyrox-gp. In the pyrox workspace in GeoML, pyrox-nn, pyrox-lgm, pyrox-ssm, pyrox-gauss and pyrox-xtreme forbid importing it in their import-guard tests. pyrox-gp builds on pyrox, pyrox-gauss, kernellib, gaussx, lineax, functax, flowjax, JAX, Equinox, NumPyro and einx, and on optax and gauss-flows through extras.">
<title>pyrox-gp in the GeoML layer</title>
<rect x="250" y="18" width="460" height="74" rx="14" fill="#111827" stroke="#94A3B8" stroke-width="2"/>
<svg x="266" y="31" width="48" height="48" viewBox="0 0 128 128"><defs><linearGradient id="prxgp-dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#E11D48"/></linearGradient></defs><g transform="translate(0 0) scale(1)"><rect x="4" y="4" width="120" height="120" rx="26" fill="url(#prxgp-dark)"/><path d="M18 70 C34 46 48 40 64 52 C80 64 92 46 110 36 L110 70 C92 82 80 96 64 86 C48 76 34 84 18 100 Z" fill="#FFFFFF" fill-opacity="0.28"/><path d="M18 85 C34 66 48 58 64 69 C80 80 92 64 110 53" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/><circle cx="30" cy="74" r="4.5" fill="#FFFFFF"/><circle cx="50" cy="63" r="4.5" fill="#FFFFFF"/><circle cx="78" cy="78" r="4.5" fill="#FFFFFF"/><circle cx="98" cy="59" r="4.5" fill="#FFFFFF"/></g></svg>
<text x="328" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E5E7EB">pyrox-gp</text>
<text x="328" y="74" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">Gaussian processes for NumPyro</text>
<rect x="20" y="140" width="920" height="126" rx="14" fill="#0F172A" stroke="#1F2937" stroke-width="1.5"/><text x="38" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">GeoML</text><text x="922" y="166" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">the pyrox workspace; no package imports pyrox-gp</text><text x="480" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9CA3AF">these siblings forbid importing pyrox-gp, each in an import-guard test</text>
<rect x="204.7" y="220" width="86.5" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="247.9" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-nn</text>
<rect x="303.1" y="220" width="94.3" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="350.3" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-lgm</text>
<rect x="409.4" y="220" width="94.3" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="456.6" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-ssm</text>
<rect x="515.7" y="220" width="109.9" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="570.7" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-gauss</text>
<rect x="637.6" y="220" width="117.7" height="26" rx="7" fill="#111827" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="696.5" y="237.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#CBD5E1">pyrox-xtreme</text>
<rect x="20" y="288" width="920" height="62" rx="10" fill="#1F2937" stroke="#374151"/>
<text x="480" y="313.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CA3AF">pyrox-gp builds on: <tspan font-weight="700" fill="#E5E7EB">pyrox</tspan> · <tspan font-weight="700" fill="#E5E7EB">pyrox-gauss</tspan> · <tspan font-weight="700" fill="#E5E7EB">kernellib</tspan> · <tspan font-weight="700" fill="#E5E7EB">gaussx</tspan> · <tspan font-weight="700" fill="#E5E7EB">lineax</tspan> · <tspan font-weight="700" fill="#E5E7EB">functax</tspan> · <tspan font-weight="700" fill="#E5E7EB">flowjax</tspan></text>
<text x="480" y="335.5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9CA3AF"><tspan font-weight="700" fill="#E5E7EB">JAX</tspan> · <tspan font-weight="700" fill="#E5E7EB">Equinox</tspan> · <tspan font-weight="700" fill="#E5E7EB">NumPyro</tspan> · <tspan font-weight="700" fill="#E5E7EB">einx</tspan> · <tspan font-weight="700" fill="#E5E7EB">optax, gauss-flows (extras)</tspan></text>
<text x="40" y="377" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9CA3AF">no arrow: nothing imports pyrox-gp. A pyrox-gp kernel still works where a kernellib kernel is expected, as in pyrox-nn's HSGPFeatures.</text>
</svg>
