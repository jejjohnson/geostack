<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="gridax holds the analysis grids; model and spectral grids stay with their schemes" font-size="13" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect x="0" y="0" width="760" height="496" rx="10" fill="#ffffff"/><defs><marker id="gdx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2328">gridax holds the analysis grids; model and spectral grids stay put</text><g><rect x="24" y="52" width="712" height="108" rx="8" fill="none" stroke="#8b949e" stroke-width="1.25"></rect><text x="40" y="76" font-weight="600" fill="#1f2328">Imported by</text><text x="40" y="102" fill="#1f2328">GeoStack: geoarray, geoops, xrops</text><text x="40" y="122" fill="#1f2328">GeoNumerics: diagnostix, tracerax</text><text x="40" y="142" font-size="11.5" fill="#57606a">Not imported by finitevolX or spectraldiffx: their grids are their discretisations</text></g><g fill="none" stroke="#8b949e" stroke-width="1.25"><path d="M380 160V204" marker-end="url(#gdx-arrow)"></path><path d="M380 286V332" marker-end="url(#gdx-arrow)"></path><path d="M380 414V438" marker-end="url(#gdx-arrow)"></path></g><text x="392" y="187" font-size="11.5" fill="#57606a">import</text><text x="392" y="314" font-size="11.5" fill="#57606a">imports</text><g><rect x="120" y="206" width="520" height="80" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="380" y="230" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">gridax · GeoNumerics tier 1</text><text x="380" y="254" text-anchor="middle" fill="#1f2328">cells · metrics · vertical · stencils · diff</text><text x="380" y="274" text-anchor="middle" font-size="11.5" fill="#57606a">takes geoops&#x27; stencil engine, and xrops&#x27; metrics and re