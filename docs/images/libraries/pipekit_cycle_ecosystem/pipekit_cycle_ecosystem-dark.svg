<svg xmlns="http://www.w3.org/2000/svg" width="960" height="770" viewBox="0 0 960 770" role="img" aria-label="The packages that import pipekit-cycle on their main branches: pipekit-jax, vardax, sesmax-experiment, somax. pipekit-cycle builds on pipekit-ops alone; its array extra installs pipekit-array beside it.">
