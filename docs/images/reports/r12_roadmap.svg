<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 454" width="840" height="454" role="img" aria-label="Roadmap. Phase 1 fixes the registry and artifact paths the running example broke: weight rebinding on load (A1), hash identity (A2), tag history and safe naming (A3), honest artifact fields (C2, C3) and the tracker run id (B4). Phase 2 adds what the scoping report asked for and nothing ships yet: a file tracker, MLflow and W&amp;B trackers, an MLflow registry, registry gc and robust fsspec writes. Phase 3 closes the round trips: retraining from an artifact, nested Hydra YAML, the Metaflow step and the run records." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="453" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="387.0" height="70.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="217.5" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · A1 A2 A3</text><text x="217.5" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">load with weights, hash</text><text x="217.5" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">identity, tag history</text><rect x="429.0" y="24.0" width="387.0" height="70.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="622.5" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · B4 C2 C3</text><text x="622.5" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">tracker run id, pinned</text><text x="622.5" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">hashes, registry URI</text><path d="M420.0,94.0 L420.0,106.0" fill="none" stroke="#94a3b8" stroke-wi