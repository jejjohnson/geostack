<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 550" width="840" height="550" role="img" aria-label="Roadmap. Phase 1 gives pipekit-evaluate its taxonomy tags, a scorer adapter over xrtoolz metrics and an evaluation report, and fixes the ladder (A1 to A4). Phase 2 fills the metric gaps where their names are already reserved: FSS and spectrum comparison, the detection scores, the missing point-wise and probabilistic scores, and the seasonal, event and member wrappers (B1 to B4, C1 to C3). Phase 3 adds the two new units: trajectories (D1, D2) and events as catalog rows (E1, E2). Phase 4 connects evaluation to training, cycles, the registry and presets (F1 to F4)." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="549" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="792.0" height="66.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="420.0" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1 · A1 to A4</text><text x="420.0" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">tags, MetricScorer,</text><text x="420.0" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">EvaluationReport, ladder fixes</text><path d="M420.0,90.0 L420.0,101.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,102.0 432,114.0 420,126.0 408,114.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="442.0" y="118.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates A1 · A2 · A3 · A4</text><path d="M420.0,126.0 L420.0,156.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="24.0" y="158.0" width="387.0" height="66.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="217.5" y="180.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">2a · B1 to B4</text><text x="217.5" y="199.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">FSS, spectrum comparison,</text><text x="217.5" y="214.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">POD/FAR/CSI, NSE, Brier</text><rect x="429.0" y="158.0" width="387.0" height="66.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="622.5" y="180.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">2b · C1 to C3</text><text x="622.5" y="199.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">by season, by event,</text><text x="622.5" y="214.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">by member</text><path d="M420.0,224.0 L420.0,235.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,236.0 432,248.0 420,260.0 408,248.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="442.0" y="252.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates B1 to B4 · C1 to C3</text><path d="M420.0,260.0 L420.0,290.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="24.0" y="292.0" width="387.0" height="66.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="217.5" y="314.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">3a · D1 D2</text><text x="217.5" y="333.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">xrtoolz.lagrangian,</text><text x="217.5" y="348.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">trajectory scores</text><rect x="429.0" y="292.0" width="387.0" height="66.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="622.5" y="314.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">3b · E1 E2</text><text x="622.5" y="333.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">event detectors,</text><text x="622.5" y="348.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">events as catalog rows</text><path d="M420.0,358.0 L420.0,369.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,370.0 432,382.0 420,394.0 408,382.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="442.0" y="386.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates D1 · D2 · E1 · E2</text><path d="M420.0,394.0 L420.0,424.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="24.0" y="426.0" width="792.0" height="66.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="420.0" y="448.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">4 · F1 to F4</text><text x="420.0" y="467.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">losses, per-step checks,</text><text x="420.0" y="482.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">registry links, presets</text><path d="M420.0,492.0 L420.0,503.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,504.0 432,516.0 420,528.0 408,516.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="442.0" y="520.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates F1 to F4</text></svg>
