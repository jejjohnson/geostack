<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 448" width="840" height="448" role="img" aria-label="Roadmap. Phase 1 runs three independent pieces side by side: the reserved state columns in geocatalog (A1), forecast alignment, member broadcasting and area weights in xrtoolz (C1 to C3) and ensemble histories in pipekit-cycle (D1); their gates must pass before phase 2. Phase 2 adds the state builder (A2), run-aware loading (B1) and the typed queries (B2) on top of A1. Phase 3 is the consumers, which are upcoming work rather than workstreams." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="447" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="252.0" height="76.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="150.0" y="51.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">1a · A1</text><text x="150.0" y="70.7" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">reserved state columns</text><text x="150.0" y="86.2" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">geocatalog schema v1</text><rect x="294.0" y="24.0" width="252.0" height="76.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="420.0" y="51.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">1b · C1 C2 C3</text><text x="420.0" y="70.7" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">align_reference · broadcasting</text><text x="420.0" y="86.2" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">cell-area weights</text><rect x="564.0" y="24.0" width="252.0" height="76.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="690.0" y="51.6" font-size="14.5"