<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382" role="img" aria-label="Readiness of Report 12&#x27;s sketches: one row per stage of the running example and per workstream, one square per stack call in its sketch, coloured by its marker. 17 runs today, 3 proposed here, 1 written by the user." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs></defs><rect x="0.5" y="0.5" width="759" height="381" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="16.0" width="17.0" height="17.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><text x="47.0" y="29.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">runs today (17)</text><rect x="162.0" y="16.0" width="17.0" height="17.0" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1.4"/><text x="185.0" y="29.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">proposed here (3)</text><rect x="313.2" y="16.0" width="17.0" height="17.0" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="336.2" y="29.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">written by the user (1)</text><text x="24.0" y="66.0" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">The running example</text><text x="24.0" y="89.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Stage 1 · Store the emulator under its content hash</text><rect x="387.2" y="76.0" width="17.0" height="17.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><rect x="407.2" y="76.0" width="17.0" height="17.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><rect x="427.2" y="76.0" width="17.0" height="17.0" rx="3" fill="#0f766e" stroke="#0f766e" stroke-width="1.4"/><text x="24.0" y="113.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Stage 2 · Load it back</text><rect x="387.2" y="100.0" width="17.0" height="17.0" rx="3" fill="#0f766e" stroke="#0f