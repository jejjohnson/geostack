<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-label="Roadmap. Phase 1 corrects the docs&#x27; oracle rule and links the reports to the cycle (D1, D2), beside transition cells and an oracle strength on the ladder (A1, A2). Phase 2 records lineage inside the registry&#x27;s hash and answers what depends on an artifact (B1, B2), beside rung-3 scoring on the parameters and posterior distances to the oracle (A3, C1, C2). Phase 3 reruns every gate on a real methane retrieval once its physics libraries are pinned." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="415" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="217.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · D1 D2</text><text x="217.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">correct the oracle rule,</text><text x="217.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">link the reports</text><rect x="429.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="622.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · A1 A2</text><text x="622.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">transition cells,</text><text x="622.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">oracle strength</text><path d="M420.0,90.0 L420.0,101.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="4