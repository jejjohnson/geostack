<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 742" width="840" height="742" role="img" aria-label="geocatalog data flow, top to bottom. Discovery sources (STAC, NASA EarthAccess and CMR, Earth Engine, local files) feed a CatalogBundle or a builder. Both produce a GeoCatalog, backed by InMemoryGeoCatalog or DuckDBGeoCatalog. A catalog yields GeoSlices; loaders turn a slice plus a catalog into a GeoTensor or an xarray Dataset. Catalogs persist as GeoParquet 1.1, which open_catalog reads back lazily." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="741" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="110.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="44.0" y="46.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">1 · Discover</text><rect x="44.0" y="62.0" width="96.4" height="26.0" rx="13.0" fill="#e8f0fb" stroke="#4C72B0" stroke-width="1.4"/><text x="92.2" y="79.7" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">STACSource</text><rect x="150.4" y="62.0" width="143.7" height="26.0" rx="13.0" fill="#e8f0fb" stroke="#4C72B0" stroke-width="1.4"/><text x="222.2" y="79.7" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">EarthAccessSource</text><rect x="304.0" y="62.0" width="91.9" height="26.0" rx="13.0" fill="#e8f0fb" stroke="#4C72B0" stroke-width="1.4"/><text x="350.0" y="79.7" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">CMRSource</text><rect x="406.0" y="62.0" width="88.6" height="26.0" rx="13.0"