<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="840" height="480" role="img" aria-label="Ownership of JAX support. At the top, pipekit pipelines of pure JAX operators (Sequential, Graph, Fanout) already run under jit, vmap and grad with respect to their inputs. pipekit core owns the operators that misbehave under tracing (Cache, Snapshot, Sink, Profile, Tap, Branch, Switch) and would add trace guards. pipekit-jax 0.0.2 ships JaxModelOp, DiffraxForwardModel, to_diffrax_adjoint and truncated_scan, and would add JaxOperator, JaxSequential, CondBranch and DebugTap. pipekit-train trains the wrapped module and pipekit-cycle owns the forward-model protocol and the adjoint specs. JAX, Equinox and diffrax are external." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="479" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="62.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="420.0" y="48.3" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit pipelines of JAX operators</text><text x="420.0" y="67.4" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">Sequential · Graph · Fanout: jit, vmap and grad over inputs run today</text><rect x="24.0" y="112.0" width="384.0" height="168.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="44.0" y="138.0" font-size="16" fill="#1e293b" text-anchor="start" font-weight="700">pipekit core</text><text x="44.0" y="160.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">wrong or trace-time only under jit:</text><rect x="44.0" y="172.0" width="56.5" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="72.2" y="189.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Cache</text><rect x="108.5" y="172.0" width="74.0" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="145.5" y="189.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Snapshot</text><rect x="190.5" y="172.0" width="46.4" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="213.7" y="189.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Sink</text><rect x="244.9" y="172.0" width="57.4" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="273.6" y="189.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Profile</text><rect x="310.3" y="172.0" width="42.7" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="331.6" y="189.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Tap</text><rect x="44.0" y="204.0" width="60.2" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="74.1" y="221.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Branch</text><rect x="112.2" y="204.0" width="59.9" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="142.2" y="221.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">Switch</text><text x="44.0" y="252.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">proposed:</text><rect x="118.0" y="236.0" width="109.9" height="26.0" rx="13.0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="172.9" y="253.1" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">trace guards (A)</text><rect x="432.0" y="112.