<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 492" width="840" height="492" role="img" aria-label="Ownership around pipekit-cycle. Scripts build cycles from pipekit-cycle and from algorithm libraries; the libraries satisfy pipekit-cycle&#x27;s protocols by structural typing and never import it. pipekit-cycle groups the cycles, the DA cycles, the protocols, the generic observation and forward helpers, the carry states and the adjoint specs. It builds on pipekit core (StatefulOperator, CarryState, Sequential); pipekit-jax reads its adjoint specs." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="491" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="380.0" height="64.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="214.0" y="49.2" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="600">scripts and notebooks</text><text x="214.0" y="69.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">build a cycle · supply the carrier and state</text><rect x="436.0" y="20.0" width="380.0" height="64.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="626.0" y="49.2" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="600">algorithm libraries</text><text x="626.0" y="69.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">filterax · vardax · plumax adapters (not checked)</text><rect x="24.0" y="120.0" width="792.0" height="230.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="44.0" y