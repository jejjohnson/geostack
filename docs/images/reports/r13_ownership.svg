<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-label="Ownership of model states. A script runs pipekit-cycle, writes one file per run and member, indexes the files with geocatalog and scores the loaded cube with xrtoolz. pipekit-cycle produces states, geocatalog indexes them (the new geocatalog.states namespace is the only new surface), xrtoolz verifies them, and pipekit-experiment supplies the producer hash. None of the four imports another; NetCDF, Zarr and GeoParquet files sit underneath." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs><rect x="0.5" y="0.5" width="839" height="469" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="58.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="420.0" y="46.2" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="600">scripts and notebooks (geostack)</text><text x="420.0" y="66.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">run the cycle · write one file per (run, member) · build the catalog</text><rect x="24.0" y="140.0" width="180.0" height="90.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="114.0" y="174.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit-cycle</text><text x="114.0" y="193.6" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">produces states</text><text x="114.0" y="209.1" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">Cycle.history</text><path d="M114.0,78.0 L114.0,138.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="228.0" y="140.0" width="180.0" height="90.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4"/><text x="318.0" y="174.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">geocatalog.states</text><text x="318.0" y="193.6" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">indexes states</text><text x="318.0" y="209.1" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">rows · load · queries</text><path d="M318.0,78.0 L318.0,138.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="432.0" y="140.0" width="180.0" height="90.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="522.0" y="174.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">xrtoolz.metrics</text><text x="522.0" y="193.6" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">scores states</text><text x="522.0" y="209.1" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">SkillByLeadTime · CRPS</text><path d="M522.0,78.0 L522.0,138.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="636.0" y="140.0" width="180.0" height="90.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="726.0" y="174.6" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit-experiment</text><text x="726.0" y="193.6" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">names the producer</text><text x="726.0" y="209.1" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">Run.pipeline_hash</text><path d="M726.0,78.0 L726.0,138.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="340.0" y="270.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400" font-style="italic">no arrows between the four: none imports another</text><rect x="24.0" y="300.0" width="792.0" height="64.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="420.0" y="329.3" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">geocatalog core · GeoSlice · backends · GeoParquet</text><text x="420.0" y="348.4" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">the existing index: footprint, valid-time interval, path, extra columns</text><path d="M318.0,230.0 L318.0,298.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="24.0" y="394.0" width="792.0" height="56.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="420.0" y="419.3" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">NetCDF · Zarr · GeoParquet (xarray, georeader)</text><text x="420.0" y="438.4" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">the state files and the catalog file</text><path d="M420.0,364.0 L420.0,392.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/></svg>
