<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-label="Roadmap. Phase 1 settles the PyPI name pipekit-core (F1) and makes pipekit&#x27;s Signature and three helpers the one public contract (A). Phase 2 runs four independent moves side by side: one model-operator family (B), the xarray vocabulary into xrtoolz-core (C), the training dataset into geotoolz-patcher (D) and the rule that a mission reader lives with its output carrier (E). Phase 3 aligns the pins, adds packaging tests and publishes in tier order (F2 to F5)." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="415" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="217.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · F1</text><text x="217.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">publish as pipekit-core,</text><text x="217.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">import pipekit</text><rect x="429.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="622.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · A</text><text x="622.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">one Signature,</text><text x="622.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">public helpers</text><path d="M420.0,90.0 L420.0,101.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,10