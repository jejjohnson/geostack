<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 454" width="840" height="454" role="img" aria-label="Roadmap. Phase 1 makes pipekit core honest under tracing: Cache refuses traced inputs and the side-effecting observers say they run at trace time (A1, A2), and the build-time versus trace-time page is written (E1). Phase 2 adds operators that are PyTrees, so gradients reach their parameters, with a JSON-safe config (B1, B2), and JAX-native control and observation operators (C1, C2). Phase 3, the transformation wrappers (D), waits for a project that needs them." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="453" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="387.0" height="70.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="217.5" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · A1 A2</text><text x="217.5" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Cache refuses tracers,</text><text x="217.5" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">observers warn</text><rect x="429.0" y="24.0" width="387.0" height="70.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="622.5" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · E1</text><text x="622.5" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">build time and trace</text><text x="622.5" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">time, in the docs</text><path d="M420.0,94.0 L420.0,106.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,107.0 433,120.0 420,133.0 407,120.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="443.0" y="124.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates A1 · A2 · E1</text><path d="M420.0,133.0 L420.0,168.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="24.0" y="170.0" width="387.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="217.5" y="194.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">2a · B1 B2</text><text x="217.5" y="213.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">JaxOperator, JaxSequential,</text><text x="217.5" y="228.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">JSON-safe config</text><rect x="429.0" y="170.0" width="387.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="622.5" y="194.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">2b · C1 C2</text><text x="622.5" y="213.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">CondBranch, CondSwitch,</text><text x="622.5" y="228.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">DebugTap</text><path d="M420.0,240.0 L420.0,252.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,253.0 433,266.0 420,279.0 407,266.0" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="443.0" y="270.5" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">gates B1 · B2 · C1 · C2</text><path d="M420.0,279.0 L420.0,314.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="24.0" y="316.0" width="792.0" height="70.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><text x="420.0" y="340.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600