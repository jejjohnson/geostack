<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 454" width="840" height="454" role="img" aria-label="Roadmap. Phase 1 fixes what the running example hit: the SimulationDataset trajectory path and its hash (A2, A3), the window import (A5), the registry round trip and the model hash (B1, B2), checkpoints, sweep selection, ValidationStep in the loop and the SVI step (C1 to C4). Phase 2 adds the missing pieces the scoping report asked for: CatalogDataset (A1), a faster cache (A4) and the amortized-inference recipe (D1). Phase 3 builds the Lightning and Keras backends (E1, E2)." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="453" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="252.0" height="70.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="150.0" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · A2 A3 A5</text><text x="150.0" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">simulation path, hash,</text><text x="150.0" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">window import</text><rect x="294.0" y="24.0" width="252.0" height="70.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="420.0" y="48.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · B1 B2</text><text x="420.0" y="67.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">registry round trip,</text><text x="420.0" y="82.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">model hash</text><rect x="564.0" y="24.0" width="252.0" height="70.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="690.0" y="48.9" f