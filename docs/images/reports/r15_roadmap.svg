<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 416" width="840" height="416" role="img" aria-label="Roadmap. Phase 1 makes the contract data with a hash (A1, A2) and its splits enforceable (B1 to B3). Phase 2 adds the baselines the contract pins, beside the xrtoolz gap-fillers (C1 to C3), and the variant and track checks in the runner (D1 to D3). Phase 3 stores contracts and submissions content-addressed and verifies submissions (E1, E2). The blind-test scoring service is left to the projects that run one." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="415" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="217.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1a · A1 A2</text><text x="217.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">BenchmarkContract,</text><text x="217.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">hash on every report</text><rect x="429.0" y="24.0" width="387.0" height="66.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="622.5" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">1b · B1 to B3</text><text x="622.5" y="65.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">block, platform, causal</text><text x="622.5" y="80.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">splits; guard in days</text><path d="M420.0,90.0 L420.0,101.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><polygon points="420,102.0 432,114.0 420,126.0 408,11