<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 490" width="840" height="490" role="img" aria-label="pipekit-experiment 0.0.2 between pipekit&#x27;s training and inference packages and external tools. It ships two protocols, run records, a content-addressed model registry with local and fsspec backends, training and inference artifacts, and adapters for Hydra, DVC and Metaflow. The MLflow and W&amp;B adapters and an MLflow registry are planned but not built. pipekit-train calls its trackers and registry; serving and orchestration stay external." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="489" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="60.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="44.0" y="46.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="600">external tools</text><rect x="200.0" y="34.0" width="56.0" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="228.0" y="51.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400">Hydra</text><rect x="266.0" y="34.0" width="44.5" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="288.2" y="51.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400">DVC</text><rect x="320.5" y="34.0" width="78.0" height="26.0" rx="13.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="359.5" y="51.5" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400">Metaflow</text><rect x="408.5" y="34.0" wi