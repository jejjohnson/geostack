<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 546" width="840" height="546" role="img" aria-label="The stack at the pinned revisions. User code (notebooks, services, orchestrators, geoapps) calls four libraries side by side: geotoolz, xrtoolz, geopatcher and geocatalog. geotoolz and xrtoolz depend on pipekit; geopatcher reaches pipekit only through its pipekit extra; geocatalog does not depend on pipekit at all. pipekit&#x27;s sister packages (array, train, experiment, evaluate, cycle, jax) sit beside it. georeader, geocloud and xarray are the substrate underneath." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="545" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="44.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="420.0" y="48.0" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">user code · notebooks · services · orchestrators · geoapps</text><rect x="24.0" y="104.0" width="180.0" height="80.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="114.0" y="141.2" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="600">geotoolz</text><text x="114.0" y="161.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">GeoTensor operators</text><path d="M114.0,64.0 L114.0,102.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="228.0" y="104.0" width="180.0" height="80.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="318.0" y="133.2" font-s