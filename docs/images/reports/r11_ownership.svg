<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 506" width="840" height="506" role="img" aria-label="pipekit-train 0.0.2. Data sources (pipekit-cycle forward models, Zarr stores, plain iterables; geocatalog is planned) feed its datasets. TrainingLoop runs on one of six backends: Equinox and the three Bayesian ones (NumPyro SVI, NumPyro MCMC, BlackJAX) are real, Lightning and Keras are scaffolds. The loop returns a trained operator, which drops into pipekit-cycle as a NeuralForward, and a TrainingArtifact for pipekit-experiment." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="505" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="252.0" height="60.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="150.0" y="47.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit-cycle</text><text x="150.0" y="65.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ForwardModel → SimulationDataset</text><path d="M150.0,80.0 L150.0,118.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="294.0" y="20.0" width="252.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="420.0" y="47.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Zarr stores</text><text x="420.0" y="65.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">XarrayWindowDataset</text><path d="M420.0,80.0 L420.0,118.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-line