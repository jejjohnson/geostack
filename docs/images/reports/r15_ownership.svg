<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="840" height="500" role="img" aria-label="Ownership of benchmarking. Benchmark projects and the gallery write contracts and read scored reports. pipekit-evaluate ships the runner (Benchmark, ReferenceRule, Scorer, Task) and, as the one new surface, would add BenchmarkContract: the frozen task, splits, references, metrics and baselines, with its hash. Each term of the contract is implemented where its data lives: splits over catalog rows in geocatalog and the window guard in pipekit-train, baselines and probabilistic scores in xrtoolz, and the content-addressed store for contracts and submissions in pipekit-experiment. All four hash with pipekit&#x27;s stable_json and sha256_hex." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="499" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="792.0" height="56.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="420.0" y="45.3" font-size="14.5" fill="#1e293b" text-anchor="middle" font-weight="600">benchmark projects · benchmarks gallery · leaderboards</text><text x="420.0" y="64.4" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">write a contract, publish its hash, submit and verify</text><rect x="24.0" y="110.0" width="792.0" height="120.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="44.0" y="136.0" font-size="16" fill="#1e293b" text-anchor="start" font-weight="700">pipekit-evaluate</text><rect x="44.0" y="150.0" width="86.6" height="26.0" rx="13.0" fill="#ff