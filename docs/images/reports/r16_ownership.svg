<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="840" height="600" role="img" aria-label="Ownership of the geo data stack, foundations at the top. Tier 1 is pipekit core and the external georeader, xarray and obstore. Tier 2 holds the pipekit subpackages, geotoolz-cloud (object storage) and xrtoolz-core (the xarray Operator and, after workstream C, the shared xarray vocabulary). Tier 3 holds geotoolz-catalog and geotoolz-patcher, which serve both lanes; the patcher&#x27;s proposed training integration is the one new surface. Tier 4 holds the two lanes: geotoolz and geotoolz-products on GeoTensor, and the xrtoolz family on xarray. The lanes never import each other. Solid arrows are base dependencies, dashed ones optional extras." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="839" height="599" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="380.0" height="58.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="214.0" y="46.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit-core  (import pipekit)</text><text x="214.0" y="64.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Operator · Sequential · Signature · serial</text><rect x="436.0" y="20.0" width="380.0" height="58.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="626.0" y="46.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">georeader · xarray · obstore</text><text x="626.0" y="64.8" font-size="11.5" fill="#64748b" text-anchor=