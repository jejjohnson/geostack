e="11.5" fill="#1e293b" text-anchor="start" font-weight="400">grid + gap-fill</text><path d="M165.0,408.0 L165.0,438.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="177.0" y="427.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">model + assimilate</text><path d="M165.0,498.0 L165.0,528.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="177.0" y="517.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">derive</text><rect x="368.0" y="309.0" width="164.0" height="48.0" rx="24" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="450.0" y="330.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="600">matchup</text><text x="450.0" y="346.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">space + time window</text><path d="M290.0,288.0 L410.0,288.0 L410.0,307.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#mb45309)"/><path d="M410.0,357.0 L410.0,378.0 L292.0,378.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#mb45309)"/><rect x="590.0" y="196.0" width="370.0" height="70.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="608.0" y="223.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Matchup pairs</text><text x="608.0" y="246.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">validation · bias correction → the misfits of the cycle</text><path d="M490.0,309.0 L490.0,231.0 L588.0,231.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#mb45309)"/><text x="775.0" y="370.0" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="700">In-situ  (bottom-up)</text><text x="775.0" y="388.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">point tables, xarray</text><rect x="590.0" y="400.0" width="370.0" height="186.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="608.0" y="428.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">In-situ networks</text><text x="608.0" y="456.0" font-size="11.5" fill="#0369a1" text-anchor="start" font-weight="700">Ocean</text><text x="698.0" y="456.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Argo · CTD · moorings · gliders</text><text x="608.0" y="480.0" font-size="11.5" fill="#7e22ce" text-anchor="start" font-weight="700">Atmosphere</text><text x="698.0" y="480.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">radiosondes · TCCON · flux towers</text><text x="608.0" y="504.0" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="700">Land</text><text x="698.0" y="504.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">soil-moisture probes · river gauges</text><text x="608.0" y="528.0" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">Ice</text><text x="698.0" y="528.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">mass-balance buoys · snow pits</text><text x="608.0" y="554.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">calibrated and sparse at source: no L0 / L1</text><text x="608.0" y="572.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">often with a depth or height axis</text><path d="M630.0,400.0 L630.0,333.0 L534.0,333.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#mb45309)"/><path d="M590.0,468.0 L292.0,468.0" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m0f766e)"/><text x="578.0" y="460.0" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400">assimilated directly (DA)</text></svg>
