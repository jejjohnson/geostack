<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="1000" height="612" role="img" aria-label="Two streams converge: the satellite chain runs L0 to L5; in-situ networks rise from below, join it by spatiotemporal matchup between L2 and L3, and enter L4 directly through assimilation. Matchup also yields the pairs that validate and bias-correct the satellite stream." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="mb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.5" y="0.5" width="999" height="611" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="165.0" y="40.0" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Satellite  (top-down)</text><text x="165.0" y="58.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">GeoTensor to L2, xarray from L3</text><rect x="40.0" y="80.0" width="250.0" height="56.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="54.0" y="102.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">L0</text><text x="54.0" y="121.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="600">Unstructured obs</text><rect x="40.0" y="170.0" width="250.0" height="56.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="54.0" y="192.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">L1</text><text x="54.0" y="211.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="600">Structured obs</text><rect 