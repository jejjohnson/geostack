<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Two streams converge: the satellite chain runs L0 to L4, in-situ observations join it by spatiotemporal matchup between L2 and L3, and enter L4 through assimilation." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="mb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.5" y="0.5" width="999" height="559" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="185.0" y="44.0" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Satellite  (top-down)</text><rect x="60.0" y="70.0" width="250.0" height="58.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="74.0" y="93.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">L0</text><text x="74.0" y="112.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="600">Raw telemetry</text><rect x="60.0" y="166.0" width="250.0" height="58.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="74.0" y="189.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">L1</text><text x="74.0" y="208.0" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="600">Calibrated radiances</text><rect x="60.0" y="262.0" width="250.0" height="58.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="74.0" y="285.0" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">L2</text><text x="74.0" y="304.0" fo