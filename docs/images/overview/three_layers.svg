<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Three layers of transformation: scientific data is harmonised into ML-ready datasets, which representation learning compresses into embeddings." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs><rect x="0.5" y="0.5" width="1099" height="249" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="40.0" width="280.0" height="150.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="40.0" y="68.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">Scientific data</text><text x="40.0" y="87.0" font-size="11.5" fill="#1d4ed8" text-anchor="start" font-weight="600">L0 → L4, both streams</text><text x="40.0" y="114.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">owned by</text><text x="40.0" y="132.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">georeader · geocatalog</text><text x="40.0" y="149.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">geoops / xrtoolz</text><text x="40.0" y="166.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">geocatalog.states</text><rect x="410.0" y="40.0" width="280.0" height="150.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="426.0" y="68.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">ML-ready</text><text x="426.0" y="87.0" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="600">tensors with provenance</text><text x="426.0" y="114.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">owned by</text><text x="426.0" y="132.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">pipekit-train CachedDataset</text><text x="426.0" y="149.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">CF-compliant datasets</text><text x="426.0" y="166.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">content-addressed splits</text><rect x="796.0" y="40.0" width="280.0" height="150.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="812.0" y="68.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">Embedding</text><text x="812.0" y="87.0" font-size="11.5" fill="#6d28d9" text-anchor="start" font-weight="600">latent representations</text><text x="812.0" y="114.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">owned by</text><text x="812.0" y="132.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">pipekit-train · pipekit-cycle</text><text x="812.0" y="149.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">encoder / decoder / latent</text><text x="812.0" y="166.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">dynamics, in the registry</text><path d="M306.0,115.0 L408.0,115.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="357.0" y="93.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">harmonise,</text><text x="357.0" y="107.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">tensorise</text><path d="M692.0,115.0 L794.0,115.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="743.0" y="93.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">compress,</text><text x="743.0" y="107.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="400">map to latents</text><text x="550.0" y="228.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ML processing pipeline  →  representation learning</text></svg>
