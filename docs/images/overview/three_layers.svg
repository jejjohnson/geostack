<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 344" width="1140" height="344" role="img" aria-label="Three layers of transformation: scientific data (observations as GeoTensors, states as xarray) is harmonised and patched into ML-ready tensors with provenance, which encoders compress into latent embeddings; decoders map latents back to fields." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect x="0.5" y="0.5" width="1139" height="343" rx="14" fill="#ffffff" stroke="#cbd5e1"/><path d="M176.0,54 L176.0,46 L564.0,46 L564.0,54" fill="none" stroke="#b45309" stroke-width="1.4"/><text x="370.0" y="38.0" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">ML processing pipeline · GeoStack</text><path d="M576.0,54 L576.0,46 L964.0,46 L964.0,54" fill="none" stroke="#6d28d9" stroke-width="1.4"/><text x="770.0" y="38.0" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">representation learning · GeoML</text><rect x="20.0" y="64.0" width="300.0" height="200.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/><text x="36.0" y="92.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">Scientific data</text><text x="36.0" y="111.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="600">L0 → L4, both streams</text><rect x="36.0" y="126.0" width="146.6" height="22.0" rx="11.0" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="109.3" y="140.8" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">observations · GeoTensor</text><rect x="188.6" y="126.0" width="89.9" height="22.0" rx="11.0" f