<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" width="1260" height="640" role="img" aria-label="The axes as a matrix: each lifecycle step from L0 to L5 (rows, each with a running example) crossed with the six-step cycle (columns) is a concrete, benchmarkable method. Step 2 is the oracle column; step 3 is scored against step 1, and steps 4 and 5 against step 2." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect x="0.5" y="0.5" width="1259" height="639" rx="14" fill="#ffffff" stroke="#cbd5e1"/><path d="M338.0,116.0 L338.0,58.0 L746.0,58.0 L746.0,112.0" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m64748b)"/><text x="348.0" y="51.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">Step 3 scored against step 1</text><path d="M542.0,116.0 L542.0,30.0 L950.0,30.0 L950.0,112.0" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m64748b)"/><path d="M950.0,30.0 L1154.0,30.0 L1154.0,112.0" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m64748b)"/><text x="552.0" y="23.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="600">Steps 4 and 5 scored against step 2</text><text x="338.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">STEP 1</text><text x="338.0" y="153.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Simple model</text><text x="338.0" y="172.0" font-size="11.5" fill="#0f766e" text-anchor="middle" font-weight="400">y = H(f(θ)) + ε</text><text x="542.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">STEP 2</text><text x="542.0" y="153.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Model-based</text><text x="542.0" y="172.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="400">p(θ | y) = p(y | θ) p(θ) / p(y)</text><text x="746.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">STEP 3</text><text x="746.0" y="153.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Emulator</text><text x="746.0" y="172.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="400">f(θ; φ) ≈ f(θ)</text><text x="950.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">STEP 4</text><text x="950.0" y="153.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Emulator-based</text><text x="950.0" y="172.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="400">p(θ | y), with f(·; φ) for f</text><text x="1154.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">STEP 5</text><text x="1154.0" y="153.0" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Amortized</text><text x="1154.0" y="172.0" font-size="11.5" fill="#6d28d9" text-anchor="middle" font-weight="400">q(θ | y; ψ) ≈ p(θ | y)</text><rect x="443.0" y="192.0" width="198.0" height="358.0" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="542.0" y="570.0" font-size="11.5" fill="#b45309" text-anchor="middle" font-weight="600">Oracle column</text><text x="40.0" y="218.0" font-size="13" fill="#be123c" text-anchor="start" font-weight="700">L4 → L5</text><text x="40.0" y="236.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="600">Derive</text><text x="40.0" y="252.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" font-style="italic">Heatwave return levels</text><rect x="244.0" y="202.0" wi