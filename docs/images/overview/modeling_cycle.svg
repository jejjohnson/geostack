<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 710" width="680" height="710" role="img" aria-label="The modeling cycle: the real-world system is both modelled (a conceptual model, written as equations and code, makes predictions) and observed (a sensor records measurements, processed into observations). The tracks meet where predictions are compared with observations. A random misfit feeds the inner loop, which estimates the state and parameters and runs the model again; a systematic misfit feeds the outer loop, which changes the model&#x27;s structure or the observing system." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="679" height="709" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="28.0" y="34.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="500">outer loop · slow: change the structure only when validation demands it</text><rect x="247.0" y="50.0" width="150.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="322.0" y="73.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Real-world</text><text x="322.0" y="91.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">system</text><path d="M247.0,76.0 L168.0,76.0 L168.0,144.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><path d="M397.0,76.0 L476.0,76.0 L476.0,144.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="44.0" y="132.0" font-size="11" fill="#6d28d9" text-anchor="start" font-weight="700">MODELING</text><text x="561.0" y="132.0" font-size="11" fill="#1d4ed8" text-anchor="end" font-weight="700">OBSERVING</text><rect x="78.0" y="146.0" width="180.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="168.0" y="176.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Conceptual model</text><rect x="391.0" y="146.0" width="170.0" height="52.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="476.0" y="176.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Sensor</text><rect x="44.0" y="246.0" width="118.0" height="50.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="103.0" y="268.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Equations</text><text x="103.0" y="286.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">analysis</text><rect x="174.0" y="246.0" width="118.0" height="50.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="233.0" y="268.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Code</text><text x="233.0" y="286.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">simulation</text><rect x="391.0" y="246.0" width="170.0" height="50.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="476.0" y="275.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Measurements</text><path d="M168.0,198.0 L168.0,216.0 L103.0,216.0 L103.0,244.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><path d="M168.0,216.0 L233.0,216.0 L233.0,244.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="109.0" y="234.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">formulate</text><text x="239.0" y="234.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">implement</text><path d="M476.0,198.0 L476.0,244.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="482.0" y="226.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">record</text><rect x="78.0" y="344.0" width="180.0" height="50.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="168.0" y="373.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Predictions</text><rect x="391.0" y="344.0" width="170.0" height="50.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="476.0" y="373.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Observations</text><path d="M103.0,296.0 L103.0,320.0 L160.0,320.0 L160.0,342.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><path d="M233.0,296.0 L233.0,320.0 L176.0,320.0 L176.0,342.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="109.0" y="313.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">derive</text><text x="239.0" y="313.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">simulate</text><path d="M476.0,296.0 L476.0,342.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="482.0" y="324.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">process</text><rect x="232.0" y="440.0" width="180.0" height="56.0" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="322.0" y="465.4" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Compare</text><text x="322.0" y="483.8" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">predictions vs observations</text><path d="M168.0,394.0 L168.0,468.0 L230.0,468.0" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m6d28d9)"/><path d="M476.0,394.0 L476.0,468.0 L414.0,468.0" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1d4ed8)"/><rect x="44.0" y="556.0" width="250.0" height="72.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="169.0" y="581.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Estimate</text><text x="169.0" y="600.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">state x: data assimilation</text><text x="169.0" y="615.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">parameters θ: calibration</text><rect x="372.0" y="556.0" width="210.0" height="72.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="477.0" y="581.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">Refine the model</text><text x="477.0" y="600.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">equations, code,</text><text x="477.0" y="615.3" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">sensors, processing</text><path d="M300.0,496.0 L300.0,520.0 L169.0,520.0 L169.0,554.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><path d="M344.0,496.0 L344.0,520.0 L477.0,520.0 L477.0,554.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="234.0" y="514.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">random misfit</text><text x="410.0" y="514.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">systematic misfit</text><path d="M44.0,592.0 L24.0,592.0 L24.0,369.0 L76.0,369.0" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m0f766e)"/><text x="44.0" y="654.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="500">inner loop · fast: update x and θ, run the same model again</text><path d="M582.0,592.0 L664.0,592.0 L664.0,14.0 L10.0,14.0 L10.0,172.0 L76.0,172.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><path d="M664.0,172.0 L563.0,172.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m1e293b)"/><text x="612.0" y="144.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">more or</text><text x="612.0" y="158.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">better data</text></svg>
