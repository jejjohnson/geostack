<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 330" width="1140" height="330" role="img" aria-label="The six-step cycle from simple model to amortized inference; step 2 is the oracle that validates steps 3 to 5, and step 6 feeds improvements back to step 1." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="mb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.5" y="0.5" width="1139" height="329" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="38.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 1</text><text x="38.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Simple model</text><text x="38.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">a generative story;</text><text x="38.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">physics you can</text><text x="38.0" y="202.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">simulate</text><path d="M186.0,164.0 L212.0,164.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="214.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="228.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 2</text><text x="228.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Model-based</text><text x="228.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">inference: slow but</text><text x="228.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">exact; classical</text><text x="228.0" y="202.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">DA / inversion</text><path d="M376.0,164.0 L402.0,164.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="404.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="418.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 3</text><text x="418.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Emulator</text><text x="418.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">neural surrogate</text><text x="418.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">trained on step 1;</text><text x="418.0" y="202.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">skip if cheap</text><path d="M566.0,164.0 L592.0,164.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="594.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="608.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 4</text><text x="608.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Emulator-based</text><text x="608.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">inference: step 2 in</text><text x="608.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">seconds, not hours</text><path d="M756.0,164.0 L782.0,164.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="784.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="798.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 5</text><text x="798.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Amortized</text><text x="798.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">inference: direct</text><text x="798.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">map obs → posterior</text><path d="M946.0,164.0 L972.0,164.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="974.0" y="110.0" width="160.0" height="108.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="988.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 6</text><text x="988.0" y="154.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Improve</text><text x="988.0" y="173.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">upgrade model, data,</text><text x="988.0" y="187.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">emulator, predictor</text><path d="M294.0,108.0 L294.0,66.0 L864.0,66.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M484.0,66.0 L484.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M674.0,66.0 L674.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M864.0,66.0 L864.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><text x="306.0" y="54.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">oracle: step 2 is the ground truth that validates steps 3–5</text><path d="M1054.0,220.0 L1054.0,286.0 L104.0,286.0 L104.0,222.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><text x="579.0" y="306.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="500">improve with the previous step as ground truth, then go around again</text></svg>
