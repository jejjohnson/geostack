<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 372" width="1180" height="372" role="img" aria-label="The six-step cycle: five steps from simple model to amortized inference; step 2 is the oracle that validates steps 3 to 5, and improvement runs alongside steps 2 to 5 as one shared step." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="mb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.5" y="0.5" width="1179" height="371" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="110.0" width="204.0" height="100.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="38.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 1</text><text x="38.0" y="154.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Simple model</text><text x="38.0" y="174.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">a generative story;</text><text x="38.0" y="188.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">physics you can simulate</text><path d="M230.0,160.0 L254.0,160.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="256.0" y="110.0" width="204.0" height="100.0" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="270.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 2</text><text x="270.0" y="154.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Model-based inference</text><text x="270.0" y="174.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">slow but exact;</text><text x="270.0" y="188.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">classical DA / inversion</text><path d="M462.0,160.0 L486.0,160.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="488.0" y="110.0" width="204.0" height="100.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="502.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 3</text><text x="502.0" y="154.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Emulator</text><text x="502.0" y="174.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">neural surrogate trained</text><text x="502.0" y="188.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">on step 1; skip if cheap</text><path d="M694.0,160.0 L718.0,160.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="720.0" y="110.0" width="204.0" height="100.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="734.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 4</text><text x="734.0" y="154.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Emulator-based inference</text><text x="734.0" y="174.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">step 2 in seconds,</text><text x="734.0" y="188.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">not hours</text><path d="M926.0,160.0 L950.0,160.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="952.0" y="110.0" width="204.0" height="100.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="966.0" y="134.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 5</text><text x="966.0" y="154.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Amortized inference</text><text x="966.0" y="174.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">a direct map:</text><text x="966.0" y="188.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">observations → posterior</text><path d="M358.0,108.0 L358.0,66.0 L1054.0,66.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M590.0,66.0 L590.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M822.0,66.0 L822.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M1054.0,66.0 L1054.0,106.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><text x="370.0" y="54.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">oracle: step 2 is the ground truth that validates steps 3–5</text><rect x="24.0" y="270.0" width="1132.0" height="72.0" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/><text x="40.0" y="296.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 6</text><text x="40.0" y="318.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Improve</text><text x="242.0" y="312.0" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">upgrade the model, data, emulator or predictor, using the previous step as ground truth</text><path d="M358.0,214.0 L358.0,266.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)" marker-start="url(#m1e293b)"/><path d="M590.0,214.0 L590.0,266.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)" marker-start="url(#m1e293b)"/><path d="M822.0,214.0 L822.0,266.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)" marker-start="url(#m1e293b)"/><path d="M1054.0,214.0 L1054.0,266.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)" marker-start="url(#m1e293b)"/></svg>
