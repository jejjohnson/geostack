<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-label="The six-step cycle: five steps from simple model to amortized inference, each with its defining equation. Step 1 simulates the training data for steps 3 and 5; step 2 is the oracle that validates steps 3 to 5; step 6 improves any step against the one before it. Cost per query falls from hours to milliseconds as training cost moves up front." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m1e293b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="m64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="mb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs><rect x="0.5" y="0.5" width="1179" height="499" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="116.0" width="204.0" height="124.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="38.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 1</text><text x="38.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Simple model</text><text x="38.0" y="180.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">a generative story;</text><text x="38.0" y="194.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">physics you can simulate</text><line x1="38" y1="210" x2="214" y2="210" stroke="#0f766e" stroke-opacity="0.25"/><text x="38.0" y="229.0" font-size="12.5" fill="#0f766e" text-anchor="start" font-weight="400">y = H(f(θ)) + ε</text><path d="M230.0,178.0 L254.0,178.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="256.0" y="116.0" width="204.0" height="124.0" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/><text x="270.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 2</text><text x="446.0" y="140.0" font-size="10.5" fill="#0f766e" text-anchor="end" font-weight="700">inner loop: x, θ</text><text x="270.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Model-based inference</text><text x="270.0" y="180.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">slow, trusted reference;</text><text x="270.0" y="194.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">classical DA / inversion</text><line x1="270" y1="210" x2="446" y2="210" stroke="#b45309" stroke-opacity="0.25"/><text x="270.0" y="229.0" font-size="12.5" fill="#b45309" text-anchor="start" font-weight="400">p(θ | y) = p(y | θ) p(θ) / p(y)</text><path d="M462.0,178.0 L486.0,178.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="488.0" y="116.0" width="204.0" height="124.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="502.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 3</text><text x="502.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Emulator</text><text x="502.0" y="180.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">neural surrogate trained</text><text x="502.0" y="194.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">on step 1; skip if cheap</text><line x1="502" y1="210" x2="678" y2="210" stroke="#6d28d9" stroke-opacity="0.25"/><text x="502.0" y="229.0" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="400">f(θ; φ) ≈ f(θ)</text><path d="M694.0,178.0 L718.0,178.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="720.0" y="116.0" width="204.0" height="124.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="734.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 4</text><text x="734.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Emulator-based inference</text><text x="734.0" y="180.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">step 2 in seconds,</text><text x="734.0" y="194.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">not hours</text><line x1="734" y1="210" x2="910" y2="210" stroke="#6d28d9" stroke-opacity="0.25"/><text x="734.0" y="229.0" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="400">p(θ | y), with f(·; φ) for f</text><path d="M926.0,178.0 L950.0,178.0" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m1e293b)"/><rect x="952.0" y="116.0" width="204.0" height="124.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="966.0" y="140.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 5</text><text x="966.0" y="160.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">Amortized inference</text><text x="966.0" y="180.0" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">a direct map:</text><text x="966.0" y="194.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">observations → posterior</text><line x1="966" y1="210" x2="1142" y2="210" stroke="#6d28d9" stroke-opacity="0.25"/><text x="966.0" y="229.0" font-size="12.5" fill="#6d28d9" text-anchor="start" font-weight="400">q(θ | y; ψ) ≈ p(θ | y)</text><path d="M358.0,114.0 L358.0,72.0 L1054.0,72.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M590.0,72.0 L590.0,112.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M822.0,72.0 L822.0,112.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><path d="M1054.0,72.0 L1054.0,112.0" fill="none" stroke="#b45309" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#mb45309)"/><text x="370.0" y="60.0" font-size="12" fill="#b45309" text-anchor="start" font-weight="600">oracle: step 2 is the trusted reference that validates steps 3–5</text><path d="M126.0,242.0 L126.0,270.0 L1054.0,270.0" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M590.0,270.0 L590.0,244.0" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m0f766e)"/><path d="M1054.0,270.0 L1054.0,244.0" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#m0f766e)"/><text x="138.0" y="288.0" font-size="12" fill="#0f766e" text-anchor="start" font-weight="600">simulate (θ, y) pairs: the training data for steps 3 and 5</text><rect x="24.0" y="310.0" width="1132.0" height="58.0" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.4"/><text x="38.0" y="332.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">STEP 6</text><text x="38.0" y="352.0" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">Improve</text><text x="116.0" y="352.0" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="700">outer loop: structure</text><text x="358.0" y="334.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">improve step 2</text><text x="358.0" y="352.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ground truth: step 1</text><text x="590.0" y="334.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">improve step 3</text><text x="590.0" y="352.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ground truth: step 2</text><text x="822.0" y="334.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">improve step 4</text><text x="822.0" y="352.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ground truth: step 3</text><text x="1054.0" y="334.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">improve step 5</text><text x="1054.0" y="352.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">ground truth: step 4</text><path d="M24.0,408.0 L1156.0,408.0" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m64748b)"/><text x="24.0" y="398.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="700">cost per query</text><line x1="358.0" y1="404" x2="358.0" y2="412" stroke="#64748b" stroke-width="1.4"/><text x="358.0" y="398.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">hours</text><line x1="822.0" y1="404" x2="822.0" y2="412" stroke="#64748b" stroke-width="1.4"/><text x="822.0" y="398.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">seconds</text><line x1="1054.0" y1="404" x2="1054.0" y2="412" stroke="#64748b" stroke-width="1.4"/><text x="1054.0" y="398.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">milliseconds</text><text x="590.0" y="430.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">training cost moves up front: steps 3 and 5 train once, then every query is cheap</text></svg>
