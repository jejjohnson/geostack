<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-label="Geo workflows from packaged to arbitrarily flexible: a packaged pipeline with built-in operators (L3) for standard workflows; a pipekit graph of built-in operators for new workflows from existing components; a graph with your own KernelOps and operators for new components; primitives on arrays in your own loop (L1) for anything." font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, &#x27;DejaVu Sans&#x27;, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker></defs><rect x="0.5" y="0.5" width="759" height="255" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="34" font-size="15" fill="#1e293b" text-anchor="start" font-weight="600">Geo workflows: from packaged to arbitrarily flexible</text><line x1="24" y1="160" x2="96" y2="160" stroke="#1d4ed8" stroke-width="3"/><line x1="124" y1="160" x2="276" y2="160" stroke="#1d4ed8" stroke-width="3"/><line x1="304" y1="160" x2="456" y2="160" stroke="#1d4ed8" stroke-width="3"/><line x1="484" y1="160" x2="636" y2="160" stroke="#1d4ed8" stroke-width="3"/><line x1="664" y1="160" x2="728" y2="160" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/><circle cx="110" cy="160" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="110" y="96" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">L3</text><text x="110" y="118" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">Packaged pipeline</text><text x="110" y="136" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">+ built-in operators</text><text x="110" y="190" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">Standard workflows,</text><text x="110" y="208" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">fast and easy</text><text x="110" y="234" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">emit_plumes.v1.run(...)</text><circle cx="290" cy="160" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="290" y="96" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">L2 + pipekit</text><text x="290" y="118" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit graph</text><text x="290" y="136" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">+ built-in operators</text><text x="290" y="190" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">New workflows,</text><text x="290" y="208" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">existing components</text><text x="290" y="234" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Graph(read, …, detect)</text><circle cx="470" cy="160" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="470" y="78" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">L2, your own</text><text x="470" y="100" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">pipekit graph</text><text x="470" y="118" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">+ your KernelOps</text><text x="470" y="136" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">+ your operators</text><text x="470" y="190" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">New components</text><text x="470" y="234" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">SwathToGrid, Detector</text><circle cx="650" cy="160" r="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="650" y="78" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">L1</text><text x="650" y="100" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">Primitives on arrays:</text><text x="650" y="118" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">full control,</text><text x="650" y="136" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">your own loop</text><text x="650" y="190" font-size="13" fill="#0f766e" text-anchor="middle" font-weight="600">Anything you want</text><text x="650" y="234" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">vmap(matched_filter_score)</text></svg>
