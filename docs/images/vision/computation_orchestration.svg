<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-label="Computation (low-level primitives to high-level built-in operators) and orchestration (your own loop to high-level runners and packaged pipelines) are two axes. Packaged pipelines and built-in runners sit at the easy-to-use end; primitives in your own loop at the fully flexible end; custom pipekit graphs, KernelOps and operator chains in between." font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, &#x27;DejaVu Sans&#x27;, sans-serif"><defs></defs><rect x="0.5" y="0.5" width="759" height="511" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="24" y="30" font-size="15" fill="#1e293b" text-anchor="start" font-weight="600">Computation and orchestration each go from packaged to hand-written</text><ellipse cx="380" cy="270" rx="206" ry="168" fill="#f1f5f9"/><line x1="170" y1="270" x2="590" y2="270" stroke="#94a3b8" stroke-width="1.25"/><line x1="380" y1="96" x2="380" y2="444" stroke="#94a3b8" stroke-width="1.25"/><text x="380" y="66" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">High-level</text><text x="380" y="84" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">orchestration APIs</text><text x="380" y="468" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">Low-level</text><text x="380" y="486" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="600">orchestration APIs</text><text x="160" y="266" font-size="13" fill="#1e293b" text-anchor="end" font-weight="600">Low-level</text><text x="160" y="284" font-size="13" fill="#1e293b" text-anchor="end" font-weight="600">computation APIs</text><text x="600" y="266" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600">High-level</text><text x="600" y="284" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600">computation APIs</text><text x="540" y="146" font-size="18" fill="#0f766e" text-anchor="middle" font-weight="600">Easy to use</text><text x="150" y="420" font-size="18" fill="#6d28d9" text-anchor="middle" font-weight="600">Fully flexible</text><text x="370" y="126" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">Built-in runners:</text><text x="370" y="142" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">ETL, train, assimilate</text><text x="470" y="196" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">Packaged pipelines</text><text x="470" y="212" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">emit_plumes.v1.run(...)</text><text x="370" y="214" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">Custom pipekit graph,</text><text x="370" y="230" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">stage by stage</text><text x="370" y="260" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">KernelOp(your kernel)</text><text x="196" y="300" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Primitives on arrays</text><text x="196" y="316" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">+ derived geometry</text><text x="394" y="300" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Operator chains</text><text x="394" y="316" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">Mask | NDVI</text><text x="508" y="300" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">Built-in</text><text x="508" y="316" font-size="12" fill="#1e293b" text-anchor="start" font-weight="400">operators</text><text x="370" y="392" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">Your own loop:</text><text x="370" y="408" font-size="12" fill="#1e293b" text-anchor="end" font-weight="400">lax.scan, async I/O</text></svg>
