<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Five emission-rate methods from one equation: the plume and the puff solve the 3D advection-diffusion equation; the cross-sectional flux, the divergence method and the IME integrate its column form over a transect, pointwise and over an area." font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="m94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect x="0.5" y="0.5" width="759" height="329" rx="14" fill="#ffffff" stroke="#cbd5e1"/><rect x="24.0" y="20.0" width="712.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="380.0" y="46.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">advection–diffusion</text><text x="380.0" y="66.3" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">∂c/∂t + u·∇c = ∇·(K∇c) + S</text><rect x="320.0" y="112.0" width="416.0" height="60.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="528.0" y="138.9" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="600">column equation</text><text x="528.0" y="158.3" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">∂Ω/∂t + U ∂Ω/∂x = K_y ∂²Ω/∂y² + q</text><path d="M528.0,80.0 L528.0,110.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><text x="538.0" y="100.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">∫ dz</text><rect x="24.0" y="250.0" width="132.8" height="60.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="90.4" y="277.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">Gaussian plume</text><text x="90.4" y="294.5" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">steady, solve</text><path d="M90.4,80.0 L90.4,248.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="168.8" y="250.0" width="132.8" height="60.0" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/><text x="235.2" y="277.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">Gaussian puff</text><text x="235.2" y="294.5" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">Green&#x27;s function</text><path d="M235.2,80.0 L235.2,248.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="313.6" y="250.0" width="132.8" height="60.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="380.0" y="277.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">cross-sectional flux</text><text x="380.0" y="294.5" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">∫ dy</text><path d="M380.0,172.0 L380.0,248.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="458.4" y="250.0" width="132.8" height="60.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="524.8" y="277.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">divergence</text><text x="524.8" y="294.5" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">∇_h · F</text><path d="M524.8,172.0 L524.8,248.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/><rect x="603.2" y="250.0" width="132.8" height="60.0" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/><text x="669.6" y="277.1" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">IME</text><text x="669.6" y="294.5" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">∬ dA, then τ_res</text><path d="M669.6,172.0 L669.6,248.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#m94a3b8)"/></svg>
