repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: local
    hooks:
      - id: readonly-submodules
        name: read-only submodules are unchanged (georeader)
        entry: python3 scripts/check_readonly_submodules.py
        language: system
        pass_filenames: false
        always_run: true
