name: DVC Check

on:
  pull_request:
    paths:
      - 'dvc.yaml'
      - 'dvc.lock'
      - '*.dvc'
      - 'scripts/**'
      - 'configs/**'

permissions:
  contents: read

jobs:
  dvc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: true
      - name: Check DVC status
        run: pixi run dvc status
      - name: Show DVC pipeline DAG
        run: pixi run dvc dag
