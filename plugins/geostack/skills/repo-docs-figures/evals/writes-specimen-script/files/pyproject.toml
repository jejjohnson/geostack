[project]
name = "krigax"
version = "0.1.0"
description = "Exact Gaussian-process regression in JAX on lineax operators"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jax>=0.4.30", "equinox>=0.11", "lineax>=0.0.7", "einx>=0.3", "jaxtyping>=0.2.30"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
xarray = ["xarray>=2024.6"]

[project.urls]
Documentation = "https://jejjohnson.github.io/krigax"

[tool.ruff]
line-length = 88
