[project]
name = "geostack"
version = "0.2.0"
description = "A JAX-native research software stack for geophysical modeling, inference and data assimilation"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# Hydra 1.3 does not run on Python 3.14 (argparse rejects its help strings).
python = ">=3.12,<3.14"
numpy = "*"
scipy = "*"
xarray = "*"
netcdf4 = "*"
matplotlib = "*"
dvc = ">=3"
hydra-core = ">=1.3"
# Full pyarrow (with Parquet): geotoolz-catalog needs it; conda-forge pyarrow-core lacks it.
pyarrow = "*"
# Geospatial stack from conda-forge (one GDAL / PROJ build): PyPI has no
# osx-arm64 wheels for some pyproj / rasterio releases the upstreams resolve to.
pyproj = "*"
rasterio = "*"
geopandas = "*"
shapely = "*"

[pypi-dependencies]
hydra-zen = ">=0.13"
omegaconf = ">=2.3"
# The reference libraries geostack builds on, installed editable from the
# git submodules in references/ (git submodule update --init).
georeader-spaceml = { path = "references/georeader", editable = true }
pipekit = { path = "references/pipekit/packages/pipekit", editable = true }
pipekit-array = { path = "references/pipekit/packages/pipekit-array", editable = true }
pipekit-cycle = { path = "references/pipekit/packages/pipekit-cycle", editable = true }
pipekit-evaluate = { path = "references/pipekit/packages/pipekit-evaluate", editable = true }
pipekit-experiment = { path = "references/pipekit/packages/pipekit-experiment", editable = true }
pipekit-jax = { path = "references/pipekit/packages/pipekit-jax", editable = true }
pipekit-train = { path = "references/pipekit/packages/pipekit-train", editable = true }
geotoolz = { path = "references/geotoolz/packages/geotoolz", editable = true }
geotoolz-catalog = { path = "references/geotoolz/packages/geotoolz-catalog", editable = true }
geotoolz-cloud = { path = "references/geotoolz/packages/geotoolz-cloud", editable = true }
geotoolz-patcher = { path = "references/geotoolz/packages/geotoolz-patcher", editable = true }
geotoolz-products = { path = "references/geotoolz/packages/geotoolz-products", editable = true }
xrtoolz = { path = "references/xrtoolz/packages/xrtoolz", editable = true }
xrtoolz-core = { path = "references/xrtoolz/packages/xrtoolz-core", editable = true }
xrtoolz-einx = { path = "references/xrtoolz/packages/xrtoolz-einx", editable = true }
xrtoolz-grad = { path = "references/xrtoolz/packages/xrtoolz-grad", editable = true }
xrtoolz-reader = { path = "references/xrtoolz/packages/xrtoolz-reader", editable = true }
xrtoolz-sklearn = { path = "references/xrtoolz/packages/xrtoolz-sklearn", editable = true }

[pypi-options.dependency-overrides]
# The reference repos are uv workspaces whose own [tool.uv.sources] point
# sibling packages at workspace or git sources; pin every one of them to
# the submodule checkout so the solve has a single source per package.
georeader-spaceml = { path = "references/georeader", editable = true }
pipekit = { path = "references/pipekit/packages/pipekit", editable = true }
pipekit-array = { path = "references/pipekit/packages/pipekit-array", editable = true }
pipekit-cycle = { path = "references/pipekit/packages/pipekit-cycle", editable = true }
pipekit-evaluate = { path = "references/pipekit/packages/pipekit-evaluate", editable = true }
pipekit-experiment = { path = "references/pipekit/packages/pipekit-experiment", editable = true }
pipekit-jax = { path = "references/pipekit/packages/pipekit-jax", editable = true }
pipekit-train = { path = "references/pipekit/packages/pipekit-train", editable = true }
geotoolz = { path = "references/geotoolz/packages/geotoolz", editable = true }
geotoolz-catalog = { path = "references/geotoolz/packages/geotoolz-catalog", editable = true }
geotoolz-cloud = { path = "references/geotoolz/packages/geotoolz-cloud", editable = true }
geotoolz-patcher = { path = "references/geotoolz/packages/geotoolz-patcher", editable = true }
geotoolz-products = { path = "references/geotoolz/packages/geotoolz-products", editable = true }
xrtoolz = { path = "references/xrtoolz/packages/xrtoolz", editable = true }
xrtoolz-core = { path = "references/xrtoolz/packages/xrtoolz-core", editable = true }
xrtoolz-einx = { path = "references/xrtoolz/packages/xrtoolz-einx", editable = true }
xrtoolz-grad = { path = "references/xrtoolz/packages/xrtoolz-grad", editable = true }
xrtoolz-reader = { path = "references/xrtoolz/packages/xrtoolz-reader", editable = true }
xrtoolz-sklearn = { path = "references/xrtoolz/packages/xrtoolz-sklearn", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pre-commit = ">=3.7"
ruff = ">=0.9"
jupytext = ">=1.16"

[feature.dev.pypi-dependencies]
ty = ">=0.0.1a6"

[feature.docs.dependencies]
nodejs = ">=18"

[feature.docs.pypi-dependencies]
mystmd = "*"

[feature.jupyterlab.dependencies]
jupyterlab = ">=4"
ipykernel = ">=6.29"
jupyterlab-git = "*"
jupyterlab-lsp = "*"
jupyter-lsp = "*"
python-lsp-server = "*"
jupyterlab-myst = "*"
ipywidgets = ">=8"
nbdime = "*"

[feature.jupyterlab.pypi-dependencies]
jupyterlab-code-formatter = "*"
jupyterlab-spellchecker = "*"

[feature.marimo.dependencies]
marimo = "*"
duckdb = ">=1"
altair = ">=5"
polars = ">=1"
pyarrow = "*"
anywidget = "*"

[feature.marimo.pypi-dependencies]
vegafusion = {version = ">=2", extras = ["embed"]}
plotly = ">=5"

[environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
jupyterlab = { features = ["dev", "jupyterlab"], solve-group = "default" }
marimo = { features = ["dev", "marimo"], solve-group = "default" }

[tasks]
test = "pytest -v"
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check scripts/"
precommit = "pre-commit run --all-files"
notebooks-to-ipynb = "python scripts/convert_notebooks.py --verbose"

[feature.docs.tasks]
docs-serve = "myst start"
docs-build = "myst build --html"

[feature.jupyterlab.tasks]
lab = "jupyter lab"

[feature.marimo.tasks]
marimo-edit = "marimo edit"
