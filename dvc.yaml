stages:
  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - data/raw
      - scripts/preprocess.py
      - src/geostack/data
    outs:
      - data/processed

  train:
    cmd: python scripts/train.py
    deps:
      - data/processed
      - scripts/train.py
      - configs/  # includes the model/ and data/ group files
      - src/geostack
    params:
      - configs/train.yaml:
          - training
    metrics:
      - results/metrics/train_metrics.json:
          cache: false
    plots:
      - results/figures/loss_curve.csv
